// Subset of Tesla Fleet Telemetry vehicle_data.proto with verified field
// numbers. Source: github.com/teslamotors/fleet-telemetry/protos/vehicle_data.proto
// (verified June 2026 against the public main branch).
//
// Field numbers in this file are the wire-format tags Tesla uses — they must
// match the upstream proto exactly or decoding silently misidentifies fields.
// When adding fields, look up the number in the upstream enum, don't invent.
syntax = "proto3";
package telemetry.vehicle_data;

import "google/protobuf/timestamp.proto";

message Payload {
  repeated Datum data = 1;
  google.protobuf.Timestamp created_at = 2;
  string vin = 3;
  bool is_resend = 4;
}

message Datum {
  Field key = 1;
  Value value = 2;
}

// Tesla's Value oneof has 54 variants. We declare the ones we actually
// inspect; unknown variants are tolerated by protobufjs and just appear
// undefined on the decoded object.
message Value {
  oneof value {
    string string_value = 1;
    int32 int_value = 2;
    int64 long_value = 3;
    float float_value = 4;
    double double_value = 5;
    bool boolean_value = 6;
    LocationValue location_value = 7;
    ChargeState charging_value = 8;
    ShiftState shift_state_value = 9;
    Invalid invalid = 10;
    ScheduledChargingModeValue scheduled_charging_mode_value = 12;
    SentryModeState sentry_mode_state_value = 13;
    ChargePortLatchValue charge_port_latch_value = 19;
    Doors door_value = 21;
    TimeValue time_value = 31;
    DetailedChargeStateValue detailed_charge_state_value = 32;
    HvacPowerState hvac_power_value = 38;
    TireLocation tire_location_value = 39;
    FastCharger fast_charger_value = 40;
    CableType cable_type_value = 41;
  }
}

message LocationValue {
  double latitude = 1;
  double longitude = 2;
}

// ChargeState enum used by ChargeState field (charging_value)
enum ChargeState {
  ChargeStateUnknown = 0;
  ChargeStateDisconnected = 1;
  ChargeStateNoPower = 2;
  ChargeStateStarting = 3;
  ChargeStateCharging = 4;
  ChargeStateComplete = 5;
  ChargeStateStopped = 6;
}

// DetailedChargeStateValue enum used by DetailedChargeState field
enum DetailedChargeStateValue {
  DetailedChargeStateUnknown = 0;
  DetailedChargeStateDisconnected = 1;
  DetailedChargeStateNoPower = 2;
  DetailedChargeStateStarting = 3;
  DetailedChargeStateCharging = 4;
  DetailedChargeStateComplete = 5;
  DetailedChargeStateStopped = 6;
}

// HvacPowerState enum used by HvacPower field (hvac_power_value) -- the
// actual on/off state of the whole climate system. HvacACEnabled (field 196)
// is only the AC/cooling subsystem specifically and can be false while
// climate is still on (fan-only, heat-only, defrost, precondition) --
// confirmed via github.com/teslamotors/fleet-telemetry 2026-07-25 after it
// caused a stuck "climate on" reading (stale HvacACEnabled=true survived a
// sleep cycle with no corresponding update).
enum HvacPowerState {
  HvacPowerStateUnknown = 0;
  HvacPowerStateOff = 1;
  HvacPowerStateOn = 2;
  HvacPowerStatePrecondition = 3;
  HvacPowerStateOverheatProtect = 4;
}

enum ScheduledChargingModeValue {
  ScheduledChargingModeUnknown = 0;
  ScheduledChargingModeOff = 1;
  ScheduledChargingModeStartAt = 2;
  ScheduledChargingModeDepartBy = 3;
}

enum SentryModeState {
  SentryModeStateUnknown = 0;
  SentryModeStateOff = 1;
  SentryModeStateIdle = 2;
  SentryModeStateArmed = 3;
  SentryModeStateAware = 4;
  SentryModeStatePanic = 5;
  SentryModeStateQuiet = 6;
}

enum ChargePortLatchValue {
  ChargePortLatchUnknown = 0;
  ChargePortLatchSNA = 1;
  ChargePortLatchDisengaged = 2;
  ChargePortLatchEngaged = 3;
  ChargePortLatchBlocking = 4;
}

enum FastCharger {
  FastChargerUnknown = 0;
  FastChargerSupercharger = 1;
  FastChargerCHAdeMO = 2;
  FastChargerGB = 3;
  FastChargerACSingleWireCAN = 4;
  FastChargerCombo = 5;
  FastChargerMCSingleWireCAN = 6;
  FastChargerOther = 7;
  FastChargerSNA = 8;
}

enum CableType {
  CableTypeUnknown = 0;
  CableTypeIEC = 1;
  CableTypeSAE = 2;
  CableTypeGB_AC = 3;
  CableTypeGB_DC = 4;
  CableTypeSNA = 5;
}

// Per-tire boolean set, used by TpmsSoftWarnings/TpmsHardWarnings.
message TireLocation {
  bool front_left = 1;
  bool front_right = 2;
  bool rear_left = 3;
  bool rear_right = 4;
}

enum ShiftState {
  ShiftStateUnknown = 0;
  ShiftStateInvalid = 1;
  ShiftStateP = 2;
  ShiftStateR = 3;
  ShiftStateN = 4;
  ShiftStateD = 5;
  ShiftStateSNA = 6;
}

enum Invalid {
  InvalidUnknown = 0;
  InvalidValue = 1;
}

message Doors {
  bool DriverFront = 1;
  bool PassengerFront = 2;
  bool DriverRear = 3;
  bool PassengerRear = 4;
  bool TrunkFront = 5;
  bool TrunkRear = 6;
}

message TimeValue {
  int32 hour = 1;
  int32 minute = 2;
  int32 second = 3;
}

// Field enum — VERIFIED numbers from upstream proto. Tesla has 260 fields
// total; we declare only the ones we currently decode. Unknown field numbers
// arriving in payloads are logged when TELEMETRY_DEBUG=1.
enum Field {
  FieldUnknown = 0;
  ChargeState = 2;
  VehicleSpeed = 4;
  Odometer = 5;
  Soc = 8;
  Gear = 10;
  GpsState = 22;
  GpsHeading = 23;
  RatedRange = 32;
  FastChargerPresent = 39;
  ChargeLimitSoc = 38;
  EstBatteryRange = 40;
  IdealBatteryRange = 41;
  BatteryLevel = 42;
  TimeToFullCharge = 43;
  ScheduledChargingStartTime = 44;
  ScheduledChargingPending = 45;
  ScheduledDepartureTime = 46;
  PreconditioningEnabled = 47;
  ScheduledChargingMode = 48;
  ChargeAmps = 49;
  BatteryHeaterOn = 55;
  DoorState = 58;
  Locked = 59;
  SentryMode = 65;
  TpmsPressureFl = 69;
  TpmsPressureFr = 70;
  TpmsPressureRl = 71;
  TpmsPressureRr = 72;
  VehicleName = 64;
  InsideTemp = 85;
  OutsideTemp = 86;
  DetailedChargeState = 179;
  ChargePortDoorOpen = 183;
  ChargerVoltage = 184;
  ChargingCableType = 185;
  FastChargerType = 193;
  HvacACEnabled = 196;
  HvacPower = 201;
  SoftwareUpdateDownloadPercentComplete = 216;
  SoftwareUpdateExpectedDurationMinutes = 217;
  SoftwareUpdateInstallationPercentComplete = 218;
  SoftwareUpdateScheduledStartTime = 219;
  SoftwareUpdateVersion = 220;
  TpmsHardWarnings = 224;
  TpmsSoftWarnings = 225;
  ValetModeEnabled = 226;
  WiperHeatEnabled = 228;
  LocatedAtHome = 229;
  LocatedAtWork = 230;
  LocatedAtFavorite = 231;
  ChargePortLatch = 118;
  MilesSinceReset = 258;
  ChargeRateMilePerHour = 256;
}
