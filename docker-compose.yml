services:
  ev-dashboard:
    build:
      context: .
      args:
        BUILD_SHA: "${BUILD_SHA:-unknown}"
    networks:
      br0:
        ipv4_address: 10.0.6.56
    mac_address: "02:E4:9B:17:2C:03"
    volumes:
      - /mnt/user/appdata/ev-dashboard/keys:/app/keys
    environment:
      - KEYS_DIR=/app/keys
      - TELEMETRY_PORT=50051
      - TESLA_LOG_API_BODIES=1
      # InfluxDB dual-write — set these (values live in .env, not here) to turn
      # on the telemetry->InfluxDB write path in server/telemetry-server.js.
      # All four required; any unset => disabled (no-op). See .env.example.
      # - INFLUX_URL=http://10.0.6.61:8086
      # - INFLUX_TOKEN=...
      # - INFLUX_ORG=...
      # - INFLUX_BUCKET=...
    env_file:
      - .env
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/frindle/ev-dashboard/main/icon.png"
    restart: unless-stopped

networks:
  br0:
    external: true
